<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0e1730"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <radialGradient id="earth" cx="34%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#8fd0ff"/>
      <stop offset="45%" stop-color="#2f7fd8"/>
      <stop offset="82%" stop-color="#123a76"/>
      <stop offset="100%" stop-color="#050c1c"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e6"/>
      <stop offset="35%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#ff9a2e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="27" cy="34" r="19"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#space)"/>

  <!-- stars -->
  <g fill="#cfe3f5">
    <circle cx="49" cy="15" r="1"/>
    <circle cx="15" cy="12" r=".8" opacity=".8"/>
    <circle cx="54" cy="46" r=".9" opacity=".7"/>
    <circle cx="10" cy="50" r=".7" opacity=".6"/>
    <circle cx="44" cy="55" r=".8" opacity=".7"/>
  </g>

  <!-- Earth: lit crescent with a night side -->
  <g clip-path="url(#disc)">
    <circle cx="27" cy="34" r="19" fill="url(#earth)"/>
    <ellipse cx="41" cy="30" rx="20" ry="24" fill="#02040a" opacity=".82"/>
  </g>
  <!-- atmosphere rim -->
  <circle cx="27" cy="34" r="19.4" fill="none" stroke="#6cb8ff" stroke-width="1.3" opacity=".7"/>

  <!-- sun glare peeking past the limb, with a diffraction cross -->
  <g transform="translate(50 24)">
    <circle r="11" fill="url(#sun)"/>
    <g stroke="#fff3d6" stroke-width="1" stroke-linecap="round" opacity=".9">
      <line x1="-13" y1="0" x2="13" y2="0"/>
      <line x1="0" y1="-13" x2="0" y2="13"/>
    </g>
    <circle r="3.2" fill="#fffaf0"/>
  </g>
</svg>
